services:
  # Applies pending Payload migrations, then exits. The app waits for it to
  # finish successfully, so a deploy either has the right schema or does not
  # start. Uses the builder stage because the runtime image is a standalone
  # bundle and does not carry the Payload CLI.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URI: ${DATABASE_URI:-postgres://portfolio:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/portfolio}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?set PAYLOAD_SECRET}
      NODE_ENV: production
    command: ['npm', 'run', 'migrate']

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # Set DATABASE_URI to point at an external Postgres; otherwise the bundled
      # `db` service is used.
      DATABASE_URI: ${DATABASE_URI:-postgres://portfolio:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/portfolio}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?set PAYLOAD_SECRET}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://edufalcao.site}
      NEXT_PUBLIC_MEDIA_HOST: ${NEXT_PUBLIC_MEDIA_HOST:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      NODE_ENV: production
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portfolio}
      POSTGRES_DB: portfolio
    ports:
      # Host port 5433 because 5432 is taken by another project's container.
      # Exposed for local development only. Remove this mapping on the VPS —
      # the app reaches the database over the compose network, not the host.
      - '${POSTGRES_HOST_PORT:-5433}:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U portfolio -d portfolio']
      interval: 10s
      timeout: 5s
      retries: 5

  # Nightly pg_dump into the Supabase bucket. The content is now the only copy
  # of the portfolio's source of truth, so this is not optional.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-portfolio}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      RETENTION_DAYS: '30'
    volumes:
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
      - backup_tmp:/backups
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        apk add --no-cache aws-cli >/dev/null 2>&1
        echo "0 3 * * * /bin/sh /usr/local/bin/backup.sh >> /var/log/backup.log 2>&1" | crontab -
        crond -f -l 8

volumes:
  db_data:
  backup_tmp:
